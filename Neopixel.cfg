# Neopixel.cfg - replaces Wled.cfg (WLED ESP32 kept dropping off Wi-Fi, 2026-11-20)
# DRAFT, NOT INCLUDED. To activate:
#   1. strip on the SKR Mini E3 V3 RGB header (PA8 data, 5V, GND); check the pinout before plugging in
#   2. install led_effect: https://github.com/julianschill/klipper-led_effect (install.sh)
#   3. printer.cfg: [include Wled.cfg] -> [include Neopixel.cfg]
#   4. moonraker.conf: remove [wled light]
# Same LIGHT_* macro names as Wled.cfg: PRINT_START/END_PRINT/CANCEL_PRINT stay unchanged.
# Colors taken from the WLED presets 1-6.

[neopixel light]
pin: PA8
chain_count: 9
color_order: GRBW   # ponytail: guessed from WLED "rgbw: true"; if colors come out wrong try GRB / RGBW
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
initial_WHITE: 0

[led_effect fx_heating]         # WLED preset 3: dark red, fx 27
leds: neopixel:light
autostart: false
frame_rate: 24
layers:
    breathing 3 1 top (0.33, 0.0, 0.0, 0.0)

[led_effect fx_bedmesh]         # WLED preset 4: orange, fx 88
leds: neopixel:light
autostart: false
frame_rate: 24
layers:
    comet 0.5 1 add (1.0, 0.63, 0.0, 0.0)

[led_effect fx_error]           # WLED preset 5: red, fx 23
leds: neopixel:light
autostart: false
frame_rate: 24
layers:
    strobe 1 1.5 add (1.0, 0.0, 0.0, 0.0)

[led_effect fx_success]         # WLED preset 6: green, fx 106
leds: neopixel:light
autostart: false
frame_rate: 24
layers:
    breathing 2 1 top (0.03, 1.0, 0.0, 0.0)

[gcode_macro LIGHT_ON]          # WLED preset 1: (106,150,145)
gcode:
  STOP_LED_EFFECTS LEDS="neopixel:light"
  SET_LED LED=light RED=0.42 GREEN=0.59 BLUE=0.57 WHITE=0

[gcode_macro LIGHT_OFF]         # WLED preset 2
gcode:
  STOP_LED_EFFECTS LEDS="neopixel:light"
  SET_LED LED=light RED=0 GREEN=0 BLUE=0 WHITE=0

[gcode_macro LIGHT_HEATING]
gcode:
  STOP_LED_EFFECTS LEDS="neopixel:light"
  SET_LED_EFFECT EFFECT=fx_heating

[gcode_macro LIGHT_BEDMESH]
gcode:
  STOP_LED_EFFECTS LEDS="neopixel:light"
  SET_LED_EFFECT EFFECT=fx_bedmesh

[gcode_macro LIGHT_ERROR]
gcode:
  STOP_LED_EFFECTS LEDS="neopixel:light"
  SET_LED_EFFECT EFFECT=fx_error

[gcode_macro LIGHT_SUCCESS]
gcode:
  STOP_LED_EFFECTS LEDS="neopixel:light"
  SET_LED_EFFECT EFFECT=fx_success
