# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# Printer Specs:
# -Ender 3 
# -Mcu: BTT SKR E3 V3.0.
# -2x Z axis
# -Sprite Extruder Pro Kit
# -CR Touch

# -------------------INCLUDE SECTIONN-------------------------------------------------

# -------------------RESONANCE TEST------------
# [include InputShaper.cfg]  # Comment this out when you disconnect the accelerometer
# ---------------------------------------------
[include Spoolman.cfg]
[include shelly.cfg]
[include PrintAction.cfg]
[include Wled.cfg]
# [include LedBanco.cfg] #  WORK IN PROGRESS
[include timelapse.cfg]
[include config_backup.cfg]
[include calibrate_flow.cfg]
[include fluidd.cfg]
[include Line_Purge.cfg]
# [include adaptive_mesh.cfg] # vecchia! KAAMP
[include Smart_Park.cfg]
[include KAMP_Settings.cfg]
[include BTTrunoutSensor.cfg]
[include SpeedTest.cfg]
[include fw_retract.cfg]

# -------------------TMC AUTOTUNE-------------------------------------------------
# NB: i due Z sono in parallelo sullo stesso driver (SKR Mini E3 V3)

[autotune_tmc stepper_x]
motor: creality-42-34
tuning_goal: performance
voltage: 24

[autotune_tmc stepper_y]
motor: BJ42D22-23V01
tuning_goal: performance
voltage: 24

[autotune_tmc stepper_z]
motor: creality-42-34
tuning_goal: silent
voltage: 24

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg
tuning_goal: performance
voltage: 24

# -------------------AUTO POWER OFF (opzionale, opt-in per stampa)----------------
# AUTO_OFF_ON prima o durante la stampa -> a fine stampa, con hotend < 50C,
# parte SHUTDOWN (Shelly + spegnimento Pi). Si resetta a ogni riavvio.

[gcode_macro _AUTO_OFF]
variable_enabled: 0
gcode:

[gcode_macro AUTO_OFF_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=_AUTO_OFF VARIABLE=enabled VALUE=1
    M117 Auto-off ATTIVO a fine stampa

[gcode_macro AUTO_OFF_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=_AUTO_OFF VARIABLE=enabled VALUE=0
    UPDATE_DELAYED_GCODE ID=_AUTO_OFF_CHECK DURATION=0
    M117 Auto-off disattivato

[delayed_gcode _AUTO_OFF_CHECK]
gcode:
    {% if printer['gcode_macro _AUTO_OFF'].enabled|int == 1 %}
        {% if printer.print_stats.state == 'printing' or printer.pause_resume.is_paused %}
            # nuova stampa in corso: stop controllo, si riarma al prossimo END_PRINT
        {% elif printer.extruder.temperature < 50 %}
            M117 AUTO POWER OFF
            SHUTDOWN
        {% else %}
            UPDATE_DELAYED_GCODE ID=_AUTO_OFF_CHECK DURATION=30
        {% endif %}
    {% endif %}

# -------------------OBICO ON-DEMAND----------------------------------------------
# Obico (AI failure detection) attivo solo durante le stampe: parte con
# PRINT_START, si ferma 2 min dopo fine/annullamento stampa. Niente autostart al boot.

[gcode_shell_command OBICO_SVC_START]
command: curl -s -X POST http://localhost:7125/machine/services/start?service=moonraker-obico-ender3
timeout: 10.
verbose: False

[gcode_shell_command OBICO_SVC_STOP]
command: curl -s -X POST http://localhost:7125/machine/services/stop?service=moonraker-obico-ender3
timeout: 10.
verbose: False

[delayed_gcode _OBICO_OFF]
gcode:
    {% if printer.print_stats.state != 'printing' and not printer.pause_resume.is_paused %}
        RUN_SHELL_COMMAND CMD=OBICO_SVC_STOP
    {% endif %}

# -------------------G34 GANTRY LEVELLING-------------------------------------------------

# [force_move]  # !!!!!!!!!!!!ONLY FOR GANTRY LEVELLING!!!!!!!!!!!!!!!!!!!!!!

# -------------------IDLE TIMEOUT-------------------------------------------------

[idle_timeout]
timeout: 1800
gcode:
    TURN_OFF_HEATERS
    M84  ; disabilita motori
    M106 S0  ; spegni ventola
    LIGHT_OFF

# -------------------EXCLUDE OBJECT-------------------------------------------------

[exclude_object]

# -------------------MCU-------------------------------------------------

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_21004A001450415833323520-if00
restart_method: command

# -------------------PI/MCU TEMPERATURE-------------------------------------------------

[temperature_sensor pi_temp]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

# -------------------VIRTUAL SDCARD-------------------------------------------------

# [virtual_sdcard] — defined in fluidd.cfg

# -------------------MORE-------------------------------------------------

# [display_status] — defined in fluidd.cfg

# [pause_resume] — defined in fluidd.cfg

# -------------------SCREEN TILT ADJUST-------------------------------------------------

[screws_tilt_adjust]
screw1: 62, 72
screw1_name: front left screw
screw2: 230, 72
screw2_name: front right screw
screw3: 230, 215
screw3_name: rear right screw
screw4: 62, 215
screw4_name: rear left screw
horizontal_move_z: 10.
speed: 200.
screw_thread: CW-M4

# -------------------MACHINE SECTIONN-------------------------------------------------

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 232 # fisico 238; +2 di margine per skew_correction (shift max 0.7mm a Y=215)
homing_speed: 150
second_homing_speed: 25

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 0  # SpreadCycle for precision at high speed
interpolate: true

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 32
endstop_pin: ^PC1
position_endstop: -30
position_min: -30
position_max: 215
homing_speed: 150
second_homing_speed: 25

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.650  # ridotto da 0.9 — guide lineari richiedono meno corrente
stealthchop_threshold: 0  # SpreadCycle for precision at high speed
interpolate: true

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
# endstop_pin: ^PC2
# position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 230
position_min: -3

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580 # 0.450
# hold_current: 0.500
stealthchop_threshold: 999999
interpolate: true

[extruder]
pressure_advance_smooth_time: 0.02
max_extrude_only_distance: 100.0
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 6.872 # 7.744
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_extrude_cross_section: 5 # Allows more to be extruded in a short distance for KAMP Line_Purge

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 0  # SpreadCycle — necessario per Pressure Advance con direct drive
interpolate: true

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PB15

[heater_fan controller_fan]
pin: PC7
heater: extruder, heater_bed
heater_temp: 45.0

[fan]
pin: PC6
kick_start_time: 0.5
off_below: 0.21

[input_shaper]
#shaper_freq_x: 57.6
#shaper_type_x: mzv
#shaper_freq_y: 37.2
#shaper_type_y: mzv

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 4000
minimum_cruise_ratio: 0.5
square_corner_velocity: 8
max_z_velocity: 10
max_z_accel: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# -------------------EXTRA SECTIONN-------------------------------------------------

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -30
y_offset: -42
#z_offset: 3.0
speed: 30 # 20
lift_speed: 30 # 15
pin_move_time: 0.68
stow_on_each_sample: false
probe_with_touch_mode: true

[safe_z_home]
home_xy_position: 145,149 # Change coordinates to the center of your print bed
speed: 200 # 50
z_hop: 10                 # Move up 10mm
z_hop_speed: 30 # 30 funzionante - originale - 5

[gcode_arcs]
resolution: 0.1

[skew_correction]

[axis_twist_compensation]
speed: 100
horizontal_move_z: 7
calibrate_start_x: 10
calibrate_end_x: 190
calibrate_y: 107

[bed_mesh]
speed: 200
horizontal_move_z: 7
mesh_min: 10, 10
mesh_max: 200, 173
probe_count: 6,6
algorithm: bicubic

